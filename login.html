<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصنع الشيخ للفوم | تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ks-kinpaku: oklch(84% 0.19 80.46);
      --ks-kinpaku-rich: oklch(77% 0.13 82);
      --ks-lacquer: oklch(7% 0.006 95);
      --ks-lacquer-deep: oklch(4% 0.004 95);
      --ks-raised: oklch(11% 0.006 95);
      --ks-champagne: oklch(91% 0 0);
      --ks-text-muted: oklch(72% 0 0);
      --ks-rule: oklch(78% 0 0 / 0.16);
      --ks-warning: oklch(58% 0.15 35);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ks-champagne);
      background: radial-gradient(circle at 50% 20%, oklch(18% 0.018 82), transparent 50%), var(--ks-lacquer);
      font-family: 'Cairo', sans-serif;
    }

    main {
      width: min(100%, 440px);
      padding: 40px 36px;
      background: var(--ks-raised);
      border: 1px solid var(--ks-rule);
      border-radius: 6px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: var(--ks-lacquer);
      background: var(--ks-kinpaku);
      border-radius: 4px;
      font-size: 22px;
      font-weight: 700;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--ks-champagne);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 13px;
      color: var(--ks-text-muted);
      margin-top: 4px;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--ks-text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      color: var(--ks-champagne);
      background: var(--ks-lacquer-deep);
      border: 1px solid var(--ks-rule);
      border-radius: 4px;
      outline: 0;
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--ks-kinpaku);
    }

    button {
      margin-top: 10px;
      padding: 13px;
      color: var(--ks-lacquer);
      background: var(--ks-kinpaku);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: var(--ks-kinpaku-rich);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.8;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-top-color: var(--ks-lacquer);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .top-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--ks-kinpaku), #70aaa2, var(--ks-kinpaku));
      background-size: 200% 100%;
      animation: progressShift 1.2s linear infinite;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .top-progress.active {
      opacity: 1;
    }

    @keyframes progressShift {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    #message {
      min-height: 22px;
      margin-top: 8px;
      color: var(--ks-warning);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="topProgress" class="top-progress" role="progressbar" aria-hidden="true"></div>
  <main>
    <div class="brand-wrap">
      <div class="mark" aria-hidden="true">🏭</div>
      <div>
        <h1>مصنع الشيخ للفوم</h1>
        <div class="subtitle">لوحة تحكم المبيعات المباشرة (Odoo Live)</div>
      </div>
    </div>
    <form id="loginForm">
      <label for="username">البريد الإلكتروني / اسم المستخدم
        <input id="username" name="username" type="text" autocomplete="username" placeholder="اكتب أو الصق اسم المستخدم" required />
      </label>
      <label for="password">كلمة المرور
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="اكتب أو الصق كلمة المرور" required />
      </label>
      <button type="submit" id="loginButton">
        <span id="btnText">تسجيل الدخول</span>
      </button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const button = document.getElementById('loginButton');
    const btnText = document.getElementById('btnText');
    const message = document.getElementById('message');
    const topProgress = document.getElementById('topProgress');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';
      button.disabled = true;
      form.username.disabled = true;
      form.password.disabled = true;
      topProgress.classList.add('active');
      button.innerHTML = '<span class="spinner"></span><span>جاري التحقق والاتصال بـ Odoo...</span>';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username: form.username.value, password: form.password.value })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || 'فشل تسجيل الدخول، يرجى التحقق من البيانات');
        button.innerHTML = '<span>✅ تم الدخول بنجاح، جاري التحويل...</span>';
        window.location.assign('/');
      } catch (error) {
        console.error('Login request failed:', error);
        message.textContent = error.message;
        button.disabled = false;
        form.username.disabled = false;
        form.password.disabled = false;
        topProgress.classList.remove('active');
        button.innerHTML = '<span id="btnText">تسجيل الدخول</span>';
      }
    });
  </script>
</body>

</html>
